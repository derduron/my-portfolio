skills:

  - name: "KiCad EDA"
    logo: "/images/sections/skills/kicad.png"
    categories: [ "Hardware"]
    summary: "Open-source schematic design and board routing. Project porting and hardware cost optimization for seamless manufacturing."

  - name: "Altium Designer"
    logo: "/images/sections/skills/altium.png"
    categories: [ "Hardware"]
    summary: "Schematic capture, multi-layer high-density PCB layout (HDI), component library management, and DFM-compliant manufacturing file generation (Gerber, BOM, Pick&Place)."

  - name: "Autodesk Fusion 360"
    logo: "/images/sections/skills/fusion.png"
    categories: [ "Mechanical"]
    summary: "Industrial enclosure design for electronics. Integrating Altium STEP models, modeling mechanical tolerances, snap-fits, and light pipes."

  - name: "FreeCAD"
    logo: "/images/sections/skills/freecad.png"
    categories: [ "Mechanical"]
    summary: "Parametric open-source 3D modeling for mechanical components and enclosures. Creating solid models and preparing drawings under ISO standards."

  - name: "STM32 Ecosystem"
    logo: "/images/sections/skills/stmicroelectronics.png"
    categories: [ "Firmware"]
    summary: "C/C++ firmware engineering utilizing STM32CubeMX and HAL/LL APIs. Peripheral configuration (DMA, ADC, TIM) and hardware power management."

  - name: "nRF Controllers (Nordic)"
    logo: "/images/sections/skills/nordic.png"
    categories: [ "Firmware"]
    summary: "Developing ultra-low power wireless applications on nRF52/nRF53 series. Implementing BLE (Bluetooth Low Energy) stacks and engineering with nRF Connect SDK (Zephyr RTOS)."

  - name: "ESP32 & Wireless"
    logo: "/images/sections/skills/espressif.png"
    categories: [ "Firmware"]
    summary: "Developing connected devices using ESP-IDF and Arduino IDE. Configuring Wi-Fi/BLE stacks and integrating MQTT for telemetry streaming."

  - name: "Node.js & TypeScript"
    logo: "/images/sections/skills/nodedotjs.png"
    categories: [ "Web"]
    summary: "Developing robust cloud backends for IoT platforms. Handling high-throughput MQTT broker data streams and designing scalable REST APIs."

  - name: "React / JavaScript"
    logo: "/images/sections/skills/react.png"
    categories: [ "Web"]
    summary: "Building responsive web dashboards for real-time telemetry visualization, chart rendering, and remote device configuration."

  - name: "3D Printing & Prototyping"
    logo: "/images/sections/skills/3dprint.png"
    categories: [ "Mechanical"]
    summary: "FDM/SLA rapid prototyping for physical form-factor validation and mechanical testing before injection molding."


