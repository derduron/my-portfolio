summary: "<style>.about-section .row { align-items: center !important; }</style>I am an End-to-End IoT and Hardware Engineer specializing in turning complex product concepts into fully functional, production-ready devices. My unique edge lies in cross-disciplinary expertise: I bridge the gap between physical electronics (multi-layer PCB design in Altium/KiCad), embedded software (STM32/ESP32 firmware), mechanical design (Fusion 360 enclosures), and modern cloud web interfaces (TypeScript/Node.js telemetry dashboards). With a solid background in industrial automation and equipment maintenance, I design hardware optimized for noise immunity, cost-efficiency, and seamless manufacturing scaling." 
